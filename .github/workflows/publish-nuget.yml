name: .NET build, test, and publish

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup NuGet sources
        run: |
          dotnet nuget add source --name "github-packages" --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true

      - name: Wait for upstream NuGet packages to be available
        run: |
          elapsed=0
          until dotnet restore --no-cache > /dev/null 2>&1; do
            if [ $elapsed -ge 1200 ]; then
              dotnet restore --no-cache
              exit 1
            fi
            echo "Waiting for upstream NuGet packages to index (${elapsed}s elapsed)..."
            sleep 30
            elapsed=$((elapsed+30))
          done

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: |
          if [ -f tests/Glacier.Storage.Tests/Glacier.Storage.Tests.csproj ]; then
            dotnet test tests/Glacier.Storage.Tests/Glacier.Storage.Tests.csproj --configuration Release --no-restore --no-build
          else
            echo "No test project found, skipping tests."
          fi

      - name: Pack Glacier.Storage
        run: dotnet pack src/Glacier.Storage/Glacier.Storage.csproj --configuration Release --no-build --output packages

      - name: NuGet login (Trusted Publishing OIDC)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        id: login
        with:
          user: spuriousbugfix

      - name: Publish to nuget.org
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          NUGET_OIDC_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_OIDC_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: dotnet nuget push "packages/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.nupkg
          generate_release_notes: true
